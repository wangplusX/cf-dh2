<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>导航站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 右上角按钮组 -->
    <div class="top-right">
        <a href="/admin.html" class="settings-btn" title="管理后台">⚙️</a>
        <button id="internalBtn" class="settings-btn" title="内部资源">🔒</button>
        <!-- 内部资源密码输入浮层 -->
        <div id="internalBox" class="internal-box" style="display:none;">
            <input type="password" id="internalPwd" placeholder="内部访问密码">
            <button id="internalSubmit">确认</button>
        </div>
        <button id="logoutBtn" class="settings-btn" style="display:none;" title="退出内部模式">🚪</button>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrapper">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入关键词搜索..." autofocus>
            <button class="search-btn" id="searchBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="rgba(80,80,80,0.5)" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- 链接展示区 -->
    <div class="links-container" id="linksContainer">
        <div class="loading">加载中...</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
