<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航管理后台</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f2f5;
            padding: 30px;
        }
        .container { max-width: 850px; margin: 0 auto; }   /* 宽度加大 */
        h2 { margin-bottom: 20px; color: #1a1a2e; }
        .login-box, .admin-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
        }
        button {
            background: #1677ff;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0958d9; }
        .link-list { margin-top: 20px; }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }
        .link-item span { word-break: break-all; margin-right: 10px; flex: 1; }
        .link-actions { display: flex; gap: 8px; }
        .add-form, .edit-form { 
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; 
        }
        .add-form input, .edit-form input { flex: 1; min-width: 150px; }
        .error { color: #ff4d4f; margin: 10px 0; }
        .public-check { display: flex; align-items: center; gap: 5px; font-size: 14px; white-space: nowrap; }
        .edit-form { 
            background: #f9f9ff; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #e0e0ff; 
            margin-top: 10px; 
        }
        #editBlock { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginBlock" class="login-box">
            <h2>管理后台</h2>
            <input type="password" id="passwordInput" placeholder="请输入管理密码" style="width:100%; margin-bottom:10px;">
            <button id="loginBtn" style="width:100%;">登录</button>
            <div id="loginError" class="error"></div>
        </div>

        <div id="adminBlock" class="admin-box" style="display:none;">
            <h2>链接管理</h2>
            <!-- 添加表单 -->
            <div class="add-form">
                <input type="text" id="newTitle" placeholder="网站标题">
                <input type="url" id="newUrl" placeholder="网址 (https://...)">
                <input type="text" id="newIcon" placeholder="自定义图标URL（可选）">
                <label class="public-check">
                    <input type="checkbox" id="newPublic" checked> 公开链接
                </label>
                <button id="addBtn">添加</button>
            </div>
            <!-- 编辑表单（默认隐藏） -->
            <div id="editBlock" class="edit-form">
                <input type="text" id="editTitle" placeholder="网站标题">
                <input type="url" id="editUrl" placeholder="网址">
                <input type="text" id="editIcon" placeholder="自定义图标URL">
                <label class="public-check">
                    <input type="checkbox" id="editPublic"> 公开链接
                </label>
                <button id="saveEditBtn">保存</button>
                <button id="cancelEditBtn" style="background:#999;">取消</button>
                <input type="hidden" id="editId">
            </div>

            <div id="adminError" class="error"></div>
            <div class="link-list" id="linkList"></div>
            <button id="logoutBtn" style="margin-top:20px; background:#999;">退出登录</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/links';
        let adminPassword = '';

        // 登录
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const pwd = document.getElementById('passwordInput').value.trim();
            if (!pwd) return;
            adminPassword = pwd;
            try {
                const testRes = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': adminPassword
                    },
                    body: JSON.stringify({ action: 'validate' })
                });
                if (testRes.status === 401) throw new Error('密码错误');
                showAdmin();
            } catch (err) {
                document.getElementById('loginError').textContent = err.message || '密码错误';
                adminPassword = '';
            }
        });

        function showAdmin() {
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('adminBlock').style.display = 'block';
            loadLinks();
        }

        // 退出
        document.getElementById('logoutBtn').addEventListener('click', () => {
            adminPassword = '';
            document.getElementById('loginBlock').style.display = 'block';
            document.getElementById('adminBlock').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        });

        // 加载链接列表
        async function loadLinks() {
            const res = await fetch(API_BASE);
            const links = await res.json();
            const listDiv = document.getElementById('linkList');
            listDiv.innerHTML = links.map(link => `
                <div class="link-item">
                    <span title="${escapeHtml(link.url)}">
                        <strong>${escapeHtml(link.title)}</strong> ${link.public === false ? '[内部]' : '[公开]'}<br>
                        <small>${escapeHtml(link.url)}</small>
                    </span>
                    <div class="link-actions">
                        <button onclick="editLink('${link.id}')">编辑</button>
                        <button onclick="deleteLink('${link.id}')" style="background:#ff4d4f;">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 删除链接
        async function deleteLink(id) {
            if (!confirm('确定删除该链接吗？')) return;
            try {
                const res = await fetch(`${API_BASE}?id=${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': adminPassword
                    }
                });
                if (res.status === 401) {
                    alert('密码错误或已过期，请重新登录');
                    document.getElementById('logoutBtn').click();
                    return;
                }
                if (!res.ok) throw new Error('删除失败');
                loadLinks();
            } catch (err) {
                document.getElementById('adminError').textContent = err.message;
            }
        }

        // 编辑链接：填充数据到编辑表单
        async function editLink(id) {
            // 从当前列表中获取该链接数据（简单方式：重新从 API 拉取，但我们已经加载了列表，
            // 更可靠的是通过 ID 找到对应数据。这里我们从已渲染的 DOM 中不太方便，所以重新请求一次完整数据)
            const res = await fetch(API_BASE);
            const links = await res.json();
            const link = links.find(l => l.id === id);
            if (!link) return;

            document.getElementById('editId').value = link.id;
            document.getElementById('editTitle').value = link.title;
            document.getElementById('editUrl').value = link.url;
            document.getElementById('editIcon').value = link.icon || '';
            document.getElementById('editPublic').checked = link.public !== false;

            document.getElementById('editBlock').style.display = 'flex';
        }

        // 保存编辑
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value.trim();
            const url = document.getElementById('editUrl').value.trim();
            const icon = document.getElementById('editIcon').value.trim() || '';
            const isPublic = document.getElementById('editPublic').checked;
            if (!title || !url) return alert('请填写标题和网址');
            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': adminPassword
                    },
                    body: JSON.stringify({ action: 'update', id, title, url, icon, isPublic })
                });
                if (res.status === 401) {
                    alert('密码错误');
                    document.getElementById('logoutBtn').click();
                    return;
                }
                if (!res.ok) throw new Error('修改失败');
                // 隐藏编辑表单并刷新
                document.getElementById('editBlock').style.display = 'none';
                loadLinks();
            } catch (err) {
                document.getElementById('adminError').textContent = err.message;
            }
        });

        // 取消编辑
        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            document.getElementById('editBlock').style.display = 'none';
        });

        // 添加链接（原有功能，保持不变）
        document.getElementById('addBtn').addEventListener('click', async () => {
            const title = document.getElementById('newTitle').value.trim();
            const url = document.getElementById('newUrl').value.trim();
            const icon = document.getElementById('newIcon').value.trim() || '';
            const isPublic = document.getElementById('newPublic').checked;
            if (!title || !url) return alert('请填写标题和网址');
            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': adminPassword
                    },
                    body: JSON.stringify({ title, url, icon, isPublic })   // 默认 action 为添加
                });
                if (res.status === 401) {
                    alert('密码错误');
                    document.getElementById('logoutBtn').click();
                    return;
                }
                if (!res.ok) throw new Error('添加失败');
                document.getElementById('newTitle').value = '';
                document.getElementById('newUrl').value = '';
                document.getElementById('newIcon').value = '';
                loadLinks();
            } catch (err) {
                document.getElementById('adminError').textContent = err.message;
            }
        });

        function escapeHtml(text) {
            return text.replace(/[&<>"]/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;'
            })[m]);
        }
    </script>
</body>
</html>
